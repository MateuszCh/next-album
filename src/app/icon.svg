      <stop offset="0" stop-color="#2b8456"/>
      <stop offset="1" stop-color="#1c6641"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#ffb454" stroke-width="5"/>
  <path d="M27 22.5v19l15.5-9.5z" fill="#ffb454" stroke="#ffb454" stroke-width="2" stroke-linejoin="round"/>
</svg>
